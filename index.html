<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Долина кислорода</title>

<style>
@font-face{
font-family:'Songer';
src:url('fonts/SONGER SemiExpanded.otf');
}

body{margin:0;font-family:'Songer', sans-serif;background:#0b0f0d;color:#fff;}

header{
position:fixed;top:0;width:100%;
display:flex;justify-content:space-between;align-items:center;
padding:15px 30px;
background:rgba(0,0,0,0.6);
z-index:1000;
}

.brand{display:flex;align-items:center;gap:12px;}
.brand img{width:60px;}
.brand span{font-size:20px;}

.contacts a{
margin-left:10px;
text-decoration:none;
color:#c8a96a;
}

section{
padding:100px 30px;
scroll-margin-top:90px;
}

h2{text-align:center;margin-bottom:20px;}

.modal{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:rgba(0,0,0,0.7);
display:none;
}

.modal.active{display:flex;}

.sheet{
background:#111;padding:20px;border-radius:20px;width:300px;
}

button{padding:10px;width:100%;background:#c8a96a;border:none;}

</style>
</head>

<body>

<header>
<div class="brand">
<img src="logo.png">
<span>Долина кислорода</span>
</div>

<div class="contacts">
<a href="tel:213131">📞</a>
<a href="https://max.ru/u/f9LHodD0cOJ_8r7TDoElxYpzl7bE4DwgJvcSoS0PYh3o7sR41hGRbE7QAHQ">MAX</a>
<a href="https://yandex.ru/maps/36/stavropol/house/polevaya_ulitsa_178str1">📍</a>
</div>
</header>

<section>
<h2>Активности</h2>
<p>Горнолыжная трасса, тюбинг, качели.</p>
</section>

<section>
<h2>Карта</h2>
<a href="https://yandex.ru/maps/36/stavropol/house/polevaya_ulitsa_178str1">Открыть Яндекс карту</a>
</section>

<button onclick="openBooking()">Забронировать</button>

<div class="modal" id="modal">
<div class="sheet">
<input placeholder="Имя">
<input placeholder="Телефон">
<button>Отправить</button>
</div>
</div>

<script>
function openBooking(){
document.getElementById('modal').classList.add('active');
}
</script>

</body>
</html>
